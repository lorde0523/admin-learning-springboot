spring:
  application:
    name: admin-learning
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:admin_learning}
    password: ${ORACLE_PASSWORD:admin_learning}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

mybatis:
  mapper-locations: classpath*:/mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

admin:
  sql-trace:
    enabled: ${SQL_TRACE_ENABLED:false}
    directory: ${SQL_TRACE_DIRECTORY:./logs/sql-trace}
