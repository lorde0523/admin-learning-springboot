spring:
  datasource:
    url: jdbc:h2:mem:admin-learning;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

mybatis:
  mapper-locations: classpath*:/mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

admin:
  sql-trace:
    enabled: true
    directory: ./build/test-sql-trace
